{% extends "base.html" %}
{% block title %}Cancel Appointment{% endblock %}
{% block content %}
    <h1>Cancel this appointment?</h1>
    <p>{{ appointment.service.name }} on {{ appointment.date }} at {{ appointment.start_time }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, cancel it</button>
        <a href="{% url 'my-appointments' %}" class="btn">Never mind</a>
    </form>
{% endblock %}
